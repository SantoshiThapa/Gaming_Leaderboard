# Render Blueprint: Postgres + 2 API nodes + load balancer (serves the frontend)
# This version creates a new database but REUSES your existing Redis (Key Value) instance,
# because the free plan allows only one Key Value per workspace.

databases:
  - name: leaderboard-db
    plan: free
    databaseName: leaderboard
    user: leaderboard

services:
  - type: web
    name: leaderboard-api-1
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: leaderboard-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: leaderboard-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: leaderboard-db, property: database }
      - key: DB_USER
        fromDatabase: { name: leaderboard-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: leaderboard-db, property: password }
      - key: REDIS_URL
        sync: false          # paste the Internal URL of your existing yt-redis here
      - key: INGEST_MODE
        value: lichess

  - type: web
    name: leaderboard-api-2
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: leaderboard-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: leaderboard-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: leaderboard-db, property: database }
      - key: DB_USER
        fromDatabase: { name: leaderboard-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: leaderboard-db, property: password }
      - key: REDIS_URL
        sync: false          # same Internal URL as api-1
      - key: INGEST_MODE
        value: lichess

  - type: web
    name: leaderboard-lb
    runtime: docker
    plan: free
    dockerfilePath: ./lb/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: BACKENDS
        sync: false          # set after first deploy: https://<api-1>.onrender.com,https://<api-2>.onrender.com
      - key: LB_STRATEGY
        value: least-connections