services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  api1:
    build: ./api
    environment: &api-env
      PORT: 8080
      DB_HOST: postgres
      DB_NAME: leaderboard
      DB_USER: leaderboard
      DB_PASSWORD: leaderboard
      REDIS_URL: redis://redis:6379
      INGEST_MODE: hybrid
      INSTANCE_NAME: api-1
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api2:
    build: ./api
    environment:
      <<: *api-env
      INSTANCE_NAME: api-2
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  lb:
    build:
      context: .
      dockerfile: lb/Dockerfile
    environment:
      PORT: 8080
      BACKENDS: http://api1:8080,http://api2:8080
      LB_STRATEGY: least-connections
    ports: ["8080:8080"]
    depends_on: [api1, api2]

volumes:
  pgdata:
